<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <form action="#" id="weatherForm">
        <input type="text" id="weatherSearch">
        <input type="submit" id="weatherBtn">
    </form>

    <div class="weatherCard"></div>

    <script>
        const apiKey = "25e3fbd9558235f6de8d7256c9c56d60";
        const weatherForm = document.querySelector('#weatherForm')
        const weatherSearch = document.querySelector('#weatherSearch');
        const weatherCard = document.querySelector('.weatherCard');

        weatherForm.addEventListener('submit', async event => {
            event.preventDefault();
            
            let userInput = weatherSearch.value;

            if(userInput){
                try {
                    const data = await getWeatherData(userInput);
                    console.log(data);
                    displayWeatherData(data);

                } 
                catch(error) {
                    weatherCard.innerHTML = `<p>City not found. Please try again.</p>`;
                }
            } 
            else {
                console.log(`error`)
            }

        })



        const getWeatherData = async (city) => {
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}`);

                if(!response.ok) {
                    throw new Error(`Something whent wrong!!`);
                }

                return await response.json();
            }

            catch(error) {
                console.error(`Error something wrong!!`)
            }
        }

       const displayWeatherData = (data) => {
    const {
        name: city,
        main: { temp, humidity },
        weather: [{ description, icon }],
    } = data;

    // Formulas:
    const celsius = Math.round(temp - 273.15);
    const fahrenheit = Math.round((temp - 273.15) * 9/5 + 32);

    const weatherInfo = `
        <h2>Weather in ${city}</h2>
        <p>Temperature: ${celsius}°C / ${fahrenheit}°F</p>
        <p>Humidity: ${humidity}%</p>
        <p>Description: ${description}</p>
        <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="${description}">
    `;


    weatherCard.innerHTML = weatherInfo;
};

    </script>
</body>
</html>
